<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor</title>
    <link rel="stylesheet" href="style.css">


</head>

<body>
    <!-- <img class="conveimg" src="./assets/img/imagem/conversao-de-moeda.png" alt="imagem-conversor"> -->
    <video class="convevideo" src="./assets/img/mp4/conversor de moeda.mp4" autoplay loop></video>
    <main>
        <label for="">Converter <strong>de</strong> </label>
        <select name="" id="">
            <option value="">R$ Real Brasileiro</option>
        </select>
        </label>

        <label for="">Converter <strong>para</strong> </label>

        <select class="currency-select" id="">

            <option value="dolar">US$ Dolar Americano</option>
            <option value="euro">€ Euro</option>
            <option value="libra">£ Libra</option>
            <option value="bitcoin">₿ Bitcoin</option>

        </select>

        </label>

        <label for="">
            Valor
            <input class="input-currency" type="number" placeholder="R$ 10.000,000">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div>
                <img class="brasilimg" src="./assets/img/imagem/Brasil.png" alt="moedabrasil">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0</p>
            </div>
            <img src="./assets/img/imagem/Vector.png" alt="">
            <div>
                <img class="dolarimg" src="./assets/img/imagem/EUA.png" alt="moedaeua">
                <p class="currency-dolar">Dólar Americano</p>
                <p class="currency-value">US$ 0</p>
                a
            </div>

        </section>


    </main>

    <script src=" script.js">
    </script>
</body>

</html>
